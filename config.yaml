# Vlog Intelligence -- config (Phase 0)
# LLM provider is swappable: change `llm.provider`/`llm.model` and, if
# needed, add a matching _call_<provider> function in
# src/extraction/extractor.py.

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.1
  max_retries: 1 # invalid JSON: retry this many times, then skip + log

chunking:
  max_tokens: 2000
  overlap_tokens: 200

transcript:
  languages: ["en"]
  cache_dir: data/transcripts
